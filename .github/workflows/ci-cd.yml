name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 🧾 Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 🐍 Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ⚡ Step 3: Cache pip dependencies for faster builds
      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # 📦 Step 4: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 🧪 Step 5: Run tests (if available)
      - name: Run tests
        run: |
          echo "Running tests..."
          pytest || echo "No tests found — continuing."

      # 🐳 Step 6: Build Docker image
      - name: Build Docker image
        run: |
          docker build -t credit-fraud-mlops .

  # 🔄 Optional job: Push Docker image to GitHub Container Registry
  push-image:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker image
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/credit-fraud-mlops:latest
          docker build -t $IMAGE_NAME .
          docker push $IMAGE_NAME
